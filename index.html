<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cansei - Criado por: Kaue, 1º B</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #050510;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.2);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #1a1a3a;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0b0b26 0%, #020208 100%);
      display: block;
    }
    .ui-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-weight: bold;
      font-size: 0.85rem;
      text-shadow: 0 0 5px #000;
      z-index: 5;
    }
    .bar-container {
      width: 140px;
      height: 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.1s ease;
    }
    #boss-bar { background: linear-gradient(90deg, #ff0055, #ff5500); width: 100%; }
    #energy-bar { background: linear-gradient(90deg, #00d2ff, #00fff0); width: 100%; }
    
    .author-badge {
      position: absolute;
      bottom: 8px;
      left: 10px;
      font-size: 0.75rem;
      color: #00fff0;
      text-shadow: 0 0 5px rgba(0, 255, 240, 0.5);
      font-weight: bold;
      pointer-events: none;
      z-index: 5;
    }

    #screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 16, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      z-index: 10;
      padding: 15px;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #00d2ff;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
      margin-bottom: 5px;
    }
    .credits {
      font-size: 1rem;
      color: #00fff0;
      font-weight: bold;
      margin-bottom: 12px;
      text-shadow: 0 0 8px rgba(0, 255, 240, 0.6);
    }
    p {
      margin-bottom: 18px;
      color: #aaa;
      font-size: 0.9rem;
      max-width: 90%;
      line-height: 1.4;
    }
    button.btn-play {
      padding: 10px 25px;
      font-size: 1.1rem;
      font-weight: bold;
      background: linear-gradient(45deg, #00d2ff, #0072ff);
      color: #fff;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
      transition: all 0.2s ease;
    }
    button.btn-play:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.8);
    }
    .controls-hint {
      margin-top: 15px;
      font-size: 0.75rem;
      color: #777;
    }

    /* Controles para Celular / Touch */
    .touch-controls {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      display: none;
      justify-content: space-between;
      padding: 0 15px;
      pointer-events: none;
      z-index: 6;
    }
    @media (hover: none) and (pointer: coarse) {
      .touch-controls { display: flex; }
    }
    .dpad, .action-btns {
      display: grid;
      gap: 5px;
      pointer-events: auto;
    }
    .dpad {
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(2, 40px);
    }
    .touch-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 8px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .touch-btn:active {
      background: rgba(0, 210, 255, 0.5);
    }
    .btn-fire {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(0, 210, 255, 0.3);
      border: 2px solid #00fff0;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" width="800" height="600"></canvas>

    <div class="ui-overlay">
      <div>
        <div>ESTICHE</div>
        <div class="bar-container"><div id="energy-bar" class="bar-fill"></div></div>
      </div>
      <div style="text-align: right;">
        <div>GIGANTE DAS GALÁXIAS</div>
        <div class="bar-container"><div id="boss-bar" class="bar-fill"></div></div>
      </div>
    </div>

    <div class="author-badge">Criado por: Kaue, 1º B</div>

    <!-- Controles Mobile -->
    <div class="touch-controls">
      <div class="dpad">
        <div></div>
        <div class="touch-btn" id="btn-up">▲</div>
        <div></div>
        <div class="touch-btn" id="btn-left">◄</div>
        <div class="touch-btn" id="btn-down">▼</div>
        <div class="touch-btn" id="btn-right">►</div>
      </div>
      <div class="action-btns">
        <div class="touch-btn btn-fire" id="btn-shoot">ATIRAR</div>
      </div>
    </div>

    <div id="screen-overlay">
      <h1 id="title-text">CANSEI</h1>
      <div class="credits">Criado por: Kaue, 1º B</div>
      <p id="desc-text">Estiche cansou das ameaças cósmicas. Chegou a hora de derrotar o Gigante de uma vez por todas!</p>
      <button class="btn-play" id="btn-action" onclick="startGame()">JOGAR</button>
      <div class="controls-hint">
        <b>Teclado:</b> [W, A, S, D] ou Setas | <b>Espaço:</b> Atirar | <b>Shift:</b> Turbo
      </div>
    </div>
  </div>

    // Controles por teclado
    window.addEventListener('keydown', e => keys[e.code] = true);

    // Suporte aos botões virtuais (Touch)
    function setupTouchBtn(id, code) {
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
      el.addEventListener('mousedown', () => keys[code] = true);
      el.addEventListener('mouseup', () => keys[code] = false);
    }
